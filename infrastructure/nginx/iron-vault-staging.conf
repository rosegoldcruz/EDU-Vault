# Stage 1 production-mode validation only.
# Install as /etc/nginx/sites-available/iron-vault-staging.conf and enable it
# without changing any existing production hostname or certificate.

server {
  listen 80;
  listen [::]:80;
  server_name staging.ironvaulttoken.com;

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 60s;
  }
}
