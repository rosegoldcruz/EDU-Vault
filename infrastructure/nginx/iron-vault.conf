# Install in /etc/nginx/sites-available/iron-vault.conf then symlink into sites-enabled.
# Certificates are issued by certbot for:
# - ironvaulttoken.com
# - member.ironvaulttoken.com
# - api.ironvaulttoken.com

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

upstream iron_vault_web {
  server 127.0.0.1:3000;
}

server {
  listen 80;
  listen [::]:80;
  server_name ironvaulttoken.com member.ironvaulttoken.com api.ironvaulttoken.com;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name ironvaulttoken.com;

  ssl_certificate /etc/letsencrypt/live/ironvaulttoken.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/ironvaulttoken.com/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  location / {
    proxy_pass http://iron_vault_web;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 60s;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name member.ironvaulttoken.com;

  ssl_certificate /etc/letsencrypt/live/member.ironvaulttoken.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/member.ironvaulttoken.com/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  # Member portal now lives inside the unified web app.
  location / {
    proxy_pass http://iron_vault_web;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 60s;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name api.ironvaulttoken.com;

  ssl_certificate /etc/letsencrypt/live/api.ironvaulttoken.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.ironvaulttoken.com/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  # The standalone API is folded into the web app's route handlers.
  # Preserve legacy paths used by external services (Authorize.net webhooks).
  location = /health {
    proxy_pass http://iron_vault_web/api/health;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /v1/ {
    rewrite ^/v1/(.*)$ /api/v1/$1 break;
    proxy_pass http://iron_vault_web;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 60s;
  }

  location / {
    proxy_pass http://iron_vault_web;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 60s;
  }
}
